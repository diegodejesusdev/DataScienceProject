services:
  mysql:
    image: mysql:8.0
    container_name: construnorte_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db/init:/docker-entrypoint-initdb.d
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --max_allowed_packet=256M
    networks:
      - construnorte_net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:latest
    container_name: construnorte_adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    networks:
      - construnorte_net
    depends_on:
      mysql:
        condition: service_healthy

  jupyter:
    build:
      context: ./docker/jupyter
      dockerfile: Dockerfile
    container_name: construnorte_jupyter
    restart: unless-stopped
    ports:
      - "8888:8888"
    volumes:
      - ./notebooks:/home/jovyan/work/notebooks
      - ./src:/home/jovyan/work/src
      - ./data:/home/jovyan/work/data
      - ./reports:/home/jovyan/work/reports
      - ./.env:/home/jovyan/work/.env:ro
    working_dir: /home/jovyan/work
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      JUPYTER_TOKEN: ${JUPYTER_TOKEN}
    networks:
      - construnorte_net
    depends_on:
      mysql:
        condition: service_healthy

networks:
  construnorte_net:
    name: construnorte_net
    driver: bridge

volumes:
  mysql_data:
    name: construnorte_mysql_data
